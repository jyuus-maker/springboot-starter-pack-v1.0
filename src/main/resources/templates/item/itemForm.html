<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${itemFormDto != null and itemFormDto.id != null} ? '상품 수정 - REHMIA ADMIN' : '상품 등록 - REHMIA ADMIN'">상품 등록 - REHMIA ADMIN</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-[#fafaf9] text-neutral-800 flex flex-col min-h-screen antialiased selection:bg-neutral-900 selection:text-white">

    <!-- 헤더 -->
    <header th:replace="~{fragment/header::headers}"></header>

    <!-- 메인 컨텐츠 -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-14">
        
        <div class="bg-white rounded-3xl shadow-sm border border-neutral-200/80 p-6 sm:p-10 lg:p-12">
            
            <div class="border-b border-neutral-200 pb-6 mb-8 flex items-center justify-between">
                <div>
                    <span class="text-xs font-bold tracking-[0.25em] text-neutral-400 uppercase">REHMIA STUDIO ADMIN</span>
                    <h2 class="text-2xl sm:text-3xl font-black text-neutral-900 tracking-tight mt-1 uppercase"
                        th:text="${itemFormDto != null and itemFormDto.id != null} ? '상품 수정 (EDIT ITEM)' : '상품 등록 (NEW ITEM)'">상품 등록</h2>
                    <p class="text-xs sm:text-sm text-neutral-500 mt-1 font-light">쇼핑몰에 판매할 애슬래틱 상품의 상세 스펙과 이미지를 등록하세요.</p>
                </div>
                <span class="text-[10px] font-bold tracking-widest px-3 py-1 bg-neutral-900 text-white rounded-full uppercase">ADMIN ONLY</span>
            </div>

            <!-- 에러 메시지 알림 -->
            <div th:if="${errorMessage}" class="mb-6 p-4 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-xs sm:text-sm flex items-center">
                <svg class="w-4 h-4 mr-2 flex-shrink-0 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${errorMessage}">오류 메시지</span>
            </div>

            <!-- 상품 등록 / 수정 폼 -->
            <form th:action="${itemFormDto != null and itemFormDto.id != null} ? @{'/admin/item/' + ${itemFormDto.id}} : @{/admin/item/new}"
                  th:object="${itemFormDto}"
                  method="post"
                  enctype="multipart/form-data"
                  class="space-y-6">

                <!-- 상품 고유 ID (수정 시 사용) -->
                <input type="hidden" th:field="*{id}">

                <!-- 1. 판매 상태 선택 -->
                <div class="w-full sm:w-1/2">
                    <label for="itemSellStatus" class="block text-xs font-bold text-neutral-700 uppercase tracking-wider mb-2">판매 상태 (STATUS)</label>
                    <select id="itemSellStatus" th:field="*{itemSellStatus}" 
                            class="w-full px-4 py-3 rounded-xl border border-neutral-300 bg-white text-neutral-900 focus:outline-none focus:ring-1 focus:ring-neutral-900 text-sm">
                        <option value="SELL">판매중 (SELL)</option>
                        <option value="SOLD_OUT">품절 (SOLD_OUT)</option>
                    </select>
                </div>

                <!-- 2. 상품명 -->
                <div>
                    <label for="itemName" class="block text-xs font-bold text-neutral-700 uppercase tracking-wider mb-2">상품명 (PRODUCT NAME) <span class="text-red-500">*</span></label>
                    <input type="text" id="itemName" th:field="*{itemName}" placeholder="예: 시그니처 테크 플렉스 레깅스"
                           class="w-full px-4 py-3 rounded-xl border text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-neutral-900 text-sm"
                           th:classappend="${#fields.hasErrors('itemName')} ? 'border-red-400 bg-red-50/30' : 'border-neutral-300 bg-white'">
                    <p th:if="${#fields.hasErrors('itemName')}" th:errors="*{itemName}" class="mt-1.5 text-xs text-red-600 font-medium"></p>
                </div>

                <!-- 3. 가격 & 재고 수량 2열 배치 -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label for="price" class="block text-xs font-bold text-neutral-700 uppercase tracking-wider mb-2">가격 (PRICE / KRW) <span class="text-red-500">*</span></label>
                        <input type="number" id="price" th:field="*{price}" placeholder="0" min="0"
                               class="w-full px-4 py-3 rounded-xl border text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-neutral-900 text-sm"
                               th:classappend="${#fields.hasErrors('price')} ? 'border-red-400 bg-red-50/30' : 'border-neutral-300 bg-white'">
                        <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="mt-1.5 text-xs text-red-600 font-medium"></p>
                    </div>

                    <div>
                        <label for="stockNumber" class="block text-xs font-bold text-neutral-700 uppercase tracking-wider mb-2">재고 수량 (STOCK) <span class="text-red-500">*</span></label>
                        <input type="number" id="stockNumber" th:field="*{stockNumber}" placeholder="0" min="0"
                               class="w-full px-4 py-3 rounded-xl border text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-neutral-900 text-sm"
                               th:classappend="${#fields.hasErrors('stockNumber')} ? 'border-red-400 bg-red-50/30' : 'border-neutral-300 bg-white'">
                        <p th:if="${#fields.hasErrors('stockNumber')}" th:errors="*{stockNumber}" class="mt-1.5 text-xs text-red-600 font-medium"></p>
                    </div>
                </div>

                <!-- 4. 상품 상세 설명 -->
                <div>
                    <label for="itemDetail" class="block text-xs font-bold text-neutral-700 uppercase tracking-wider mb-2">상품 상세 설명 (EDITORIAL DESCRIPTION) <span class="text-red-500">*</span></label>
                    <textarea id="itemDetail" th:field="*{itemDetail}" rows="6" placeholder="기능성 소재, 착용감, 인체공학적 패턴 등 상품의 구체적인 특징을 입력하세요."
                              class="w-full px-4 py-3 rounded-xl border text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-neutral-900 text-sm font-light leading-relaxed"
                              th:classappend="${#fields.hasErrors('itemDetail')} ? 'border-red-400 bg-red-50/30' : 'border-neutral-300 bg-white'"></textarea>
                    <p th:if="${#fields.hasErrors('itemDetail')}" th:errors="*{itemDetail}" class="mt-1.5 text-xs text-red-600 font-medium"></p>
                </div>

                <!-- 5. 상품 이미지 업로드 영역 -->
                <div class="border-t border-neutral-200 pt-6">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-neutral-900 mb-1">PRODUCT IMAGES UPLOAD</h3>
                    <p class="text-xs text-neutral-400 mb-4 font-light">첫 번째 이미지는 쇼핑몰 대표 이미지로 등록됩니다. (최대 5개 등록 가능)</p>

                    <!-- 신규 등록 시 파일 인풋 리스트 -->
                    <div th:if="${#lists.isEmpty(itemFormDto.itemImgDtoList)}" class="space-y-3">
                        <div th:each="num : ${#numbers.sequence(1,5)}" class="flex items-center space-x-3 p-3.5 bg-[#fafaf9] rounded-2xl border border-neutral-200">
                            <span class="w-24 text-[11px] font-bold text-neutral-700 uppercase tracking-wider" th:text="${num == 1 ? 'MAIN IMG *' : 'SUB IMG ' + num}">이미지 1</span>
                            <input type="file" name="itemImgFile" accept="image/*"
                                   class="block w-full text-xs text-neutral-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-[11px] file:font-bold file:bg-neutral-900 file:text-white hover:file:bg-neutral-800 cursor-pointer">
                        </div>
                    </div>

                    <!-- 상품 수정 시 기존 이미지 표시 및 변경 인풋 -->
                    <div th:if="${not #lists.isEmpty(itemFormDto.itemImgDtoList)}" class="space-y-3">
                        <div th:each="itemImgDto, status : ${itemFormDto.itemImgDtoList}" class="flex items-center space-x-3 p-3.5 bg-[#fafaf9] rounded-2xl border border-neutral-200">
                            <input type="hidden" name="itemImgIds" th:value="${itemImgDto.id}">
                            <div class="w-14 h-16 rounded-xl bg-neutral-200 overflow-hidden flex-shrink-0 border border-neutral-300">
                                <img th:if="${not #strings.isEmpty(itemImgDto.imgUrl)}" th:src="${itemImgDto.imgUrl}" alt="상품이미지" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-grow">
                                <span class="block text-xs font-bold text-neutral-700" 
                                      th:text="${not #strings.isEmpty(itemImgDto.oriImgName)} ? ${itemImgDto.oriImgName} : ('상품 이미지 ' + ${status.count})">기존 파일명</span>
                                <input type="file" name="itemImgFile" accept="image/*"
                                       class="mt-1 block w-full text-xs text-neutral-500 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-[11px] file:font-bold file:bg-neutral-900 file:text-white hover:file:bg-neutral-800 cursor-pointer">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- CSRF 토큰 -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- 하단 버튼 영역 -->
                <div class="flex items-center justify-end space-x-4 pt-6 border-t border-neutral-200">
                    <a href="/" class="px-6 py-3 rounded-full border border-neutral-300 text-neutral-700 hover:bg-neutral-100 font-bold text-xs uppercase tracking-wider transition">
                        CANCEL
                    </a>
                    <button type="submit"
                            class="px-8 py-3 bg-neutral-950 hover:bg-neutral-800 active:bg-black text-white font-bold rounded-full shadow-lg hover:shadow-xl transition cursor-pointer text-xs uppercase tracking-wider"
                            th:text="${itemFormDto != null and itemFormDto.id != null} ? '상품 수정 완료 (SAVE)' : '상품 등록 완료 (SUBMIT)'">
                        등록하기
                    </button>
                </div>
            </form>
        </div>

    </main>

    <!-- 푸터 -->
    <footer th:replace="~{fragment/footer::footers}"></footer>

</body>
</html>
