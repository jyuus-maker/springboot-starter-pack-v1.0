<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title th:text="${item != null ? item.itemName + ' - REHMIA ATHLETIC' : '상품 상세 - REHMIA ATHLETIC'}">상품 상세 - REHMIA</title>
    <!-- Tailwind CSS 컴파일 빌드된 output.css 연결 -->
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-[#fcfbf9] text-neutral-900 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- 상단 글로벌 네비게이션 헤더 -->
    <div th:replace="~{fragment/header::headers}"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">

        <!-- 브레드크럼 (Breadcrumb Navigation) -->
        <nav class="flex text-xs text-neutral-400 font-medium space-x-2 mb-8 tracking-wider uppercase">
            <a href="/" class="hover:text-neutral-900 transition">HOME</a>
            <span>/</span>
            <a href="/#productList" class="hover:text-neutral-900 transition">COLLECTION</a>
            <span>/</span>
            <span class="text-neutral-900 font-bold" th:text="${item != null ? item.itemName : 'ACTIVEWEAR'}">ITEM DETAIL</span>
        </nav>

        <!-- 상품 기본 정보 그리드 (좌측 이미지 갤러리 + 우측 상세 주문 카드) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-14 mb-16">

            <!-- 좌측 : 이미지 갤러리 영역 (7칸) -->
            <div class="lg:col-span-7 space-y-4">
                <!-- 메인 대표 뷰어 -->
                <div class="overflow-hidden rounded-3xl bg-neutral-100 aspect-3/4 max-h-[580px] w-full flex items-center justify-center border border-neutral-200/80 shadow-sm relative group">
                    <img id="mainImg"
                         th:src="${item != null and item.itemImgDtoList != null and not #lists.isEmpty(item.itemImgDtoList) ? item.itemImgDtoList[0].imgUrl : 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800'}"
                         th:alt="${item != null ? item.itemName : '대표 이미지'}"
                         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <span class="absolute top-4 left-4 px-3 py-1 bg-black/70 backdrop-blur-md text-white text-[10px] font-bold rounded-full tracking-widest uppercase">
                        REHMIA STUDIO
                    </span>
                </div>

                <!-- 서브 썸네일 리스트 -->
                <div class="flex items-center space-x-3 overflow-x-auto pb-2"
                     th:if="${item != null and item.itemImgDtoList != null and not #lists.isEmpty(item.itemImgDtoList)}">
                    <button type="button" th:each="itemImg : ${item.itemImgDtoList}"
                            th:onclick="'changeMainImg(\'' + ${itemImg.imgUrl} + '\')'"
                            class="w-20 h-24 rounded-2xl overflow-hidden border-2 border-transparent hover:border-neutral-900 focus:border-neutral-900 transition shrink-0 bg-neutral-100 cursor-pointer">
                        <img th:src="${itemImg.imgUrl}" alt="썸네일" class="w-full h-full object-cover">
                    </button>
                </div>
            </div>

            <!-- 우측 : 상품 옵션 및 주문 박스 (5칸) -->
            <div class="lg:col-span-5 flex flex-col justify-between space-y-6">

                <div class="space-y-6">
                    <!-- 브랜드 라인 및 상태 배지 -->
                    <div class="flex items-center justify-between border-b border-neutral-200 pb-4">
                        <span class="text-xs font-bold tracking-[0.25em] text-neutral-400 uppercase">2026-2027 TECHNICAL WEAR</span>
                        <span th:if="${item != null and item.itemSellStatus != null and item.itemSellStatus.name() == 'SELL'}"
                              class="inline-flex px-3 py-1 bg-neutral-900 text-white text-[10px] font-bold rounded-full uppercase tracking-wider">
                            판매중 (IN STOCK)
                        </span>
                        <span th:if="${item == null or (item.itemSellStatus != null and item.itemSellStatus.name() != 'SELL')}"
                              class="inline-flex px-3 py-1 bg-rose-100 text-rose-700 text-[10px] font-bold rounded-full uppercase tracking-wider">
                            품절 (SOLD OUT)
                        </span>
                    </div>

                    <!-- 상품명 및 가격 -->
                    <div class="space-y-2">
                        <h1 class="text-2xl sm:text-3xl font-black text-neutral-950 tracking-tight leading-snug"
                            th:text="${item != null ? item.itemName : '시그니처 테크 플렉스 레깅스'}">
                            시그니처 테크 플렉스 레깅스
                        </h1>
                        <p class="text-xs text-neutral-500 font-light leading-relaxed">
                            인체공학적 압박 패턴과 통기성 4방향 스트레치 원단으로 완성된 르미아의 시그니처 액티브웨어.
                        </p>
                    </div>

                    <!-- 단가 표시 (히든 필드 보관) -->
                    <div class="bg-neutral-100/70 p-4 rounded-2xl flex items-center justify-between">
                        <span class="text-xs font-medium text-neutral-500">정상 판매가</span>
                        <div class="text-right">
                            <span class="text-2xl font-black text-neutral-950"
                                  th:text="${item != null ? #numbers.formatInteger(item.price, 0, 'COMMA') + '원' : '69,000원'}">69,000원</span>
                        </div>
                    </div>

                    <!-- 히든 필드: 상품 ID 및 단가 -->
                    <input type="hidden" id="itemId" th:value="${item != null ? item.id : 1}">
                    <input type="hidden" id="unitPrice" th:value="${item != null ? item.price : 69000}">

                    <!-- 수량 선택 컨트롤러 -->
                    <div class="space-y-2 pt-2">
                        <label class="text-xs font-bold text-neutral-700 uppercase tracking-wider">SELECT QUANTITY (수량)</label>
                        <div class="flex items-center justify-between bg-neutral-50 border border-neutral-200 p-2 rounded-2xl">
                            <span class="text-xs text-neutral-500 pl-3">주문 수량 선택</span>
                            <div class="flex items-center space-x-2">
                                <div class="flex items-center border border-neutral-300 rounded-full bg-white overflow-hidden px-1 py-0.5">
                                    <button type="button" onclick="decreaseCount()" 
                                            class="w-9 h-9 rounded-full flex items-center justify-center text-neutral-600 hover:bg-neutral-100 transition font-bold focus:outline-none cursor-pointer">-</button>
                                    <input type="number" id="orderCount" name="count" value="1" min="1" max="99" 
                                           onchange="calculateTotalPrice()"
                                           class="w-12 text-center font-bold text-neutral-900 focus:outline-none border-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none text-sm">
                                    <button type="button" onclick="increaseCount()" 
                                            class="w-9 h-9 rounded-full flex items-center justify-center text-neutral-600 hover:bg-neutral-100 transition font-bold focus:outline-none cursor-pointer">+</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 총 주문 금액 및 구매 버튼 -->
                    <div class="space-y-4 pt-4 border-t border-neutral-200">
                        <div class="flex items-baseline justify-between">
                            <span class="text-xs font-bold text-neutral-400 uppercase tracking-wider">TOTAL AMOUNT</span>
                            <span id="totalPrice" class="text-3xl font-black text-neutral-950">69,000원</span>
                        </div>

                        <!-- 버튼 그룹 (로딩 스피너 & 중복 클릭 방지 탑재) -->
                        <div class="grid grid-cols-2 gap-3 sm:gap-4 pt-2">
                            <button type="button" id="addCartBtn" onclick="addCart(this)"
                                    class="w-full py-4 px-4 bg-white border-2 border-neutral-900 text-neutral-950 hover:bg-neutral-50 font-bold rounded-full transition flex items-center justify-center space-x-2 cursor-pointer text-xs uppercase tracking-wider">
                                <svg class="w-4 h-4 text-neutral-950" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                                <span>장바구니 담기</span>
                            </button>
                            <button type="button" id="orderNowBtn" onclick="orderNow(this)"
                                    class="w-full py-4 px-4 bg-neutral-950 hover:bg-neutral-800 active:bg-black text-white font-bold rounded-full shadow-lg hover:shadow-xl transition flex items-center justify-center space-x-2 cursor-pointer text-xs uppercase tracking-wider">
                                <span>바로 구매하기</span>
                            </button>
                        </div>
                    </div>

                </div>

            </div>
        </div>

        <!-- 상품 상세 탭 및 상세 설명 내용 -->
        <div class="bg-white rounded-3xl shadow-sm border border-neutral-200/80 p-6 sm:p-10 lg:p-12">
            <div class="border-b border-neutral-200 mb-8">
                <nav class="flex space-x-8 text-xs font-bold tracking-widest uppercase">
                    <button class="border-b-2 border-neutral-950 py-4 px-1 text-neutral-950">01 / PRODUCT DETAILS</button>
                    <button class="border-b-2 border-transparent py-4 px-1 text-neutral-400 hover:text-neutral-700 transition">02 / CARE & SHIPPING</button>
                </nav>
            </div>

            <!-- 상세 텍스트 내용 -->
            <div class="max-w-3xl mx-auto text-neutral-700 leading-relaxed space-y-6">
                <div class="text-center mb-8">
                    <span class="text-xs font-bold tracking-[0.25em] text-neutral-400 uppercase">REHMIA PERFORMANCE STUDIO</span>
                    <h3 class="text-xl sm:text-2xl font-black text-neutral-900 mt-1">THE ATHLETIC ESSENCE</h3>
                </div>
                
                <div class="whitespace-pre-line text-sm sm:text-base text-neutral-600 leading-relaxed bg-[#fbfbfa] p-8 rounded-2xl border border-neutral-200/60 font-light"
                     th:text="${item != null ? item.itemDetail : '도심과 운동의 경계를 허무는 르미아의 테크니컬 액티브웨어입니다. 4방향 스트레치 원사와 인체공학적 무봉제 심리스 공법을 적용하여 착용 즉시 자유로운 움직임과 완벽한 지지력을 선사합니다.'}">
                    상품 상세 설명 내용
                </div>

                <!-- 상세 이미지 목록 반복 렌더링 -->
                <div class="space-y-8 pt-8 text-center">
                    <div th:if="${item != null and item.itemImgDtoList != null}" th:each="itemImg : ${item.itemImgDtoList}">
                        <img th:src="${itemImg.imgUrl}" alt="상세 설명 이미지" class="max-w-2xl mx-auto rounded-2xl shadow-sm border border-neutral-200">
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- 푸터 (토스트, 비동기 모달, Api 클라이언트 자동 포함) -->
    <footer th:replace="~{fragment/footer::footers}"></footer>

    <!-- 수량 계산 및 주문/장바구니 자바스크립트 -->
    <script>
        function changeMainImg(src) {
            document.getElementById('mainImg').src = src;
        }

        function calculateTotalPrice() {
            const count = parseInt(document.getElementById('orderCount').value, 10) || 1;
            const unitPrice = parseInt(document.getElementById('unitPrice').value, 10) || 0;
            const total = count * unitPrice;
            document.getElementById('totalPrice').innerText = total.toLocaleString() + '원';
        }

        function increaseCount() {
            const countInput = document.getElementById('orderCount');
            let current = parseInt(countInput.value, 10) || 1;
            if (current < 99) {
                countInput.value = current + 1;
                calculateTotalPrice();
            }
        }

        function decreaseCount() {
            const countInput = document.getElementById('orderCount');
            let current = parseInt(countInput.value, 10) || 1;
            if (current > 1) {
                countInput.value = current - 1;
                calculateTotalPrice();
            }
        }

        /**
         * [장바구니 담기 비동기 요청 - 커스텀 모달 & 토스트 연동]
         */
        async function addCart(btn) {
            const itemId = document.getElementById('itemId').value;
            const count = parseInt(document.getElementById('orderCount').value, 10) || 1;

            const triggerBtn = btn || document.getElementById('addCartBtn');
            const res = await Api.post('/cart', { itemId: itemId, count: count }, triggerBtn);

            if (res.success) {
                const moveToCart = await Modal.confirm('상품을 쇼핑백(장바구니)에 담았습니다.\n지금 쇼핑백으로 이동하시겠습니까?', {
                    title: '쇼핑백 담기 완료',
                    confirmText: '쇼핑백 이동',
                    cancelText: '계속 쇼핑하기'
                });
                if (moveToCart) {
                    location.href = '/cart';
                } else {
                    Toast.success('쇼핑백에 상품이 안전하게 보관되었습니다.');
                }
            } else {
                Toast.error(res.message || '쇼핑백 담기에 실패하였습니다.');
            }
        }

        /**
         * [바로 구매하기 비동기 요청 - 커스텀 모달 & 로딩 스피너 탑재]
         */
        async function orderNow(btn) {
            const itemId = document.getElementById('itemId').value;
            const count = parseInt(document.getElementById('orderCount').value, 10) || 1;

            const confirmed = await Modal.confirm('선택하신 수량(' + count + '개)으로 즉시 주문을 진행하시겠습니까?', {
                title: '즉시 주문 확인',
                confirmText: '주문하기'
            });
            if (!confirmed) return;

            const triggerBtn = btn || document.getElementById('orderNowBtn');
            const res = await Api.post('/order', { itemId: itemId, count: count }, triggerBtn);

            if (res.success) {
                Toast.success(res.message || '주문이 성공적으로 접수되었습니다.');
                setTimeout(() => { location.href = '/orders'; }, 600);
            } else {
                Toast.error(res.message || '주문 처리에 실패하였습니다.');
            }
        }

        // 초기 금액 계산 실행
        calculateTotalPrice();
    </script>
</body>
</html>
