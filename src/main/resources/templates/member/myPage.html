<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY STUDIO - REHMIA</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-[#fafaf9] text-neutral-800 flex flex-col min-h-screen antialiased selection:bg-neutral-900 selection:text-white">

    <!-- 헤더 -->
    <header th:replace="~{fragment/header::headers}"></header>

    <!-- 메인 컨텐츠 -->
    <main class="flex-grow flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-lg bg-white rounded-3xl border border-neutral-200/80 p-8 sm:p-10 shadow-sm">
            
            <div class="border-b border-neutral-200 pb-6 mb-8 text-center">
                <span class="text-xs font-bold tracking-[0.25em] text-neutral-400 uppercase">MY REHMIA MEMBERSHIP</span>
                <h2 class="text-2xl sm:text-3xl font-black text-neutral-900 tracking-tight mt-1 uppercase">MY STUDIO</h2>
                <p class="text-xs text-neutral-500 mt-1 font-light">고객님의 계정 정보 및 멤버십 등급을 관리합니다.</p>
            </div>

            <div class="space-y-4">
                <div class="flex items-center justify-between p-4 bg-[#fafaf9] rounded-2xl border border-neutral-200/60">
                    <span class="text-xs font-bold text-neutral-500 uppercase tracking-wider">ACCOUNT EMAIL</span>
                    <span class="text-sm font-bold text-neutral-900" th:text="${email} ?: 'guest@rehmia.com'">user@rehmia.com</span>
                </div>

                <div class="flex items-center justify-between p-4 bg-[#fafaf9] rounded-2xl border border-neutral-200/60" sec:authorize="isAuthenticated()">
                    <span class="text-xs font-bold text-neutral-500 uppercase tracking-wider">AUTHORITY LEVEL</span>
                    <span class="text-xs font-bold px-3 py-1 bg-neutral-900 text-white rounded-full uppercase tracking-wider" sec:authentication="principal.authorities">[ROLE_USER]</span>
                </div>

                <div class="flex items-center justify-between p-4 bg-[#fafaf9] rounded-2xl border border-neutral-200/60">
                    <span class="text-xs font-bold text-neutral-500 uppercase tracking-wider">MEMBERSHIP TIER</span>
                    <span class="text-xs font-bold text-neutral-900 uppercase tracking-wider">BLACK VIP PASS</span>
                </div>
            </div>

            <div class="mt-8 flex flex-col sm:flex-row gap-3">
                <a href="/" class="flex-1 text-center py-3.5 px-4 bg-neutral-100 hover:bg-neutral-200 text-neutral-900 rounded-full transition-colors font-bold text-xs uppercase tracking-wider">
                    BACK TO SHOP
                </a>
                <form th:action="@{/members/logout}" method="post" class="flex-1">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="w-full py-3.5 px-4 bg-neutral-900 hover:bg-red-600 text-white rounded-full transition-colors font-bold text-xs uppercase tracking-wider cursor-pointer">
                        SIGN OUT (로그아웃)
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <footer th:replace="~{fragment/footer::footers}"></footer>

</body>
</html>
