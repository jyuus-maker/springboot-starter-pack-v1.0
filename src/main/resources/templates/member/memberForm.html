<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOIN US - REHMIA</title>
    <!-- Tailwind CSS 컴파일된 스타일시트 -->
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-[#fafaf9] text-neutral-800 flex flex-col min-h-screen antialiased selection:bg-neutral-900 selection:text-white">

    <!-- 공통 헤더 -->
    <header th:replace="~{fragment/header::headers}"></header>

    <!-- 회원가입 메인 컨테이너 -->
    <main class="flex-grow flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-sm border border-neutral-200/80 p-8 sm:p-10">
            
            <!-- 타이틀 헤더 -->
            <div class="text-center mb-8">
                <span class="text-xs font-bold tracking-[0.25em] text-neutral-400 uppercase">REHMIA MEMBERSHIP</span>
                <h1 class="text-2xl sm:text-3xl font-black text-neutral-900 tracking-tight mt-1 uppercase">JOIN US</h1>
                <p class="text-xs text-neutral-500 mt-1 font-light">르미아 회원만을 위한 웰컴 혜택과 프리미엄 큐레이션을 만나보세요.</p>
            </div>

            <!-- 서버 비즈니스 로직 오류 메시지 (중복 회원 등) -->
            <div th:if="${errorMessage}" class="mb-6 p-4 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-xs flex items-center">
                <svg class="w-4 h-4 mr-2 flex-shrink-0 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                </svg>
                <span th:text="${errorMessage}">오류 메시지</span>
            </div>

            <!-- 회원가입 폼 -->
            <form th:action="@{/members/new}" th:object="${memberFormDto}" method="post" class="space-y-4">
                
                <!-- 1. 이름 필드 -->
                <div>
                    <label for="name" class="block text-xs font-bold text-neutral-700 uppercase tracking-wider mb-1.5">FULL NAME (이름) <span class="text-red-500">*</span></label>
                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           placeholder="홍길동"
                           class="w-full px-4 py-3 rounded-xl border text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-neutral-900 transition duration-150"
                           th:classappend="${#fields.hasErrors('name')} ? 'border-red-400 bg-red-50/30' : 'border-neutral-300 bg-white'" />
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-xs text-red-600 font-medium"></p>
                </div>

                <!-- 2. 이메일 필드 -->
                <div>
                    <label for="email" class="block text-xs font-bold text-neutral-700 uppercase tracking-wider mb-1.5">EMAIL ADDRESS (이메일) <span class="text-red-500">*</span></label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           placeholder="example@rehmia.com"
                           class="w-full px-4 py-3 rounded-xl border text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-neutral-900 transition duration-150"
                           th:classappend="${#fields.hasErrors('email')} ? 'border-red-400 bg-red-50/30' : 'border-neutral-300 bg-white'" />
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-xs text-red-600 font-medium"></p>
                </div>

                <!-- 3. 비밀번호 필드 -->
                <div>
                    <label for="password" class="block text-xs font-bold text-neutral-700 uppercase tracking-wider mb-1.5">PASSWORD (비밀번호) <span class="text-red-500">*</span></label>
                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           placeholder="4자 이상 16자 이하"
                           class="w-full px-4 py-3 rounded-xl border text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-neutral-900 transition duration-150"
                           th:classappend="${#fields.hasErrors('password')} ? 'border-red-400 bg-red-50/30' : 'border-neutral-300 bg-white'" />
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-xs text-red-600 font-medium"></p>
                </div>

                <!-- 4. 비밀번호 확인 필드 -->
                <div>
                    <label for="passwordConfirm" class="block text-xs font-bold text-neutral-700 uppercase tracking-wider mb-1.5">CONFIRM PASSWORD (비밀번호 확인) <span class="text-red-500">*</span></label>
                    <input type="password"
                           id="passwordConfirm"
                           th:field="*{passwordConfirm}"
                           placeholder="비밀번호를 한번 더 입력해주세요"
                           class="w-full px-4 py-3 rounded-xl border text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-neutral-900 transition duration-150"
                           th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'border-red-400 bg-red-50/30' : 'border-neutral-300 bg-white'" />
                    <p th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}" class="mt-1 text-xs text-red-600 font-medium"></p>
                </div>

                <!-- 제출 버튼 -->
                <div class="pt-3">
                    <button type="submit"
                            class="w-full bg-neutral-950 hover:bg-neutral-800 active:bg-black text-white font-bold py-3.5 px-4 rounded-full shadow-md hover:shadow-lg transition cursor-pointer text-xs uppercase tracking-wider">
                        CREATE ACCOUNT (회원가입)
                    </button>
                </div>

                <!-- 로그인 페이지 이동 링크 -->
                <div class="text-center pt-4 border-t border-neutral-100">
                    <p class="text-xs text-neutral-500 font-light">
                        이미 계정이 있으신가요?
                        <a href="/members/login" class="font-bold text-neutral-900 hover:underline ml-1">
                            SIGN IN (로그인)
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </main>

    <!-- 공통 푸터 -->
    <footer th:replace="~{fragment/footer::footers}"></footer>

</body>
</html>
