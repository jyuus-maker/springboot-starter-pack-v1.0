spring.application.name=springboot-starter-pack-v1.0

# ==============================================================================
# [데이터베이스 연결 설정]
# ==============================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/shopdb
spring.datasource.username=postgres
spring.datasource.password=My123456789!

spring.jpa.properties.hibernate.show_sql=true
#실행되는 SQL을 콘솔에 출력, true는 개발환경에서만.
#***운영 환경에서는 false

spring.jpa.properties.hibernate.format_sql=true
#SQL을 보기좋게 줄바꿈, 들여쓰기 해서 출력

logging.level.org.hibernate.orm.jdbc.bind=trace
#***중요!!) 개발 환경 전용, 운영 환경에서는 반드시 끌 것
#SQL의 ? 자리에 실제로 어떤 값이 바인딩됐는지 보여주는 설정

spring.jpa.hibernate.ddl-auto=update
# none : 아무 작업도 안함(기본값)
# validate : 엔티티와 테이블 구조가 일치하는지만 검사
# update : 테이블이 없으면 생성, 있으면 변경한 것만 반영
# create : 시작할 때마다 테이블을 새로 생성(기본 테이블 삭제용)
# create-drop : 시작할 때 생성, 종료할 때 삭제

spring.devtools.livereload.enabled=true
# 파일 저장 시 브라우저 자동 새로고침(html, css 등 변경사항 즉시 반영)

spring.jpa.defer-datasource-initialization=true
# 데이터베이스 초기화(테이블이나 데이터 생성) 시점을 뒤로 미룸
# 애플리케이션 시작과 DB 초기화 순서가 꼬이지 않도록 안전하게 처리

spring.thymeleaf.cache=false
#***중요!!) 운영환경에서는 반드시 true로 변경
# false : html(화면)을 매번 새로 읽어서, 수정시 바로 반영됨(개발용)
# true : 한번 읽은 화면 캐시해서 재사용(운영환경에서는 성능이 중요하므로)

spring.servlet.multipart.max-file-size=20MB
# 파일 1개 당 업로드되는 최대 크기

spring.servlet.multipart.max-request-size=100MB
# 요청 1건(여러 파일 포함) 전체의 최대 크기

itemImgLocation=C:/shopmall/item
# 업로드된 상품 이미지가 실제로 저장되는 서버 폴더 경로
# 운영환경에서는 실제 배포 서버의 경로로 변경 필요

uploadPath=file:///C:/shopmall/
# 서버가 지정된 파일을 읽어서 화면에 보여줄 때 참조하는 기본 경로
# file:///    는 http주소가 아님. 로컬파일 시스템 경로라는 의미.

spring.jpa.properties.hibernate.default_batch_fetch_size=1000
# 연관된 엔티티를 지연 로딩(LAZY)할 때, N+1 문제를 줄이기 위해
# 한번의 쿼리로 최대 1000개씩 묶어서 IN 절로 가져오도록 설정
