# ==============================================================================
# [Nginx 리버스 프록시 및 정적/미디어 캐싱 설정 - nginx.conf]
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # 파일 업로드 허용 용량 설정 (Spring Boot 설정과 일치: 100MB)
    client_max_body_size 100M;

    # --------------------------------------------------------------------------
    # 1. Gzip 압축 전송 최적화 (텍스트/CSS/JS 대역폭 절감 및 로딩 가속)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 2. 업로드 상품 이미지(/images/**) 직접 서빙 & 브라우저 캐싱 (고속 응답)
    # --------------------------------------------------------------------------
    location /images/ {
        alias /data/shopmall/item/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 3. 모든 웹 요청 및 API: Spring Boot 백엔드 컨테이너(app:8080)로 리버스 프록시
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        # 원본 클라이언트 정보 보존 헤더
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 및 연결 유지 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
